version: '3.8'

services:
  # --- 1. BANCO DE DADOS (POSTGRES) ---
  db:
    image: postgres:15-alpine
    container_name: imobiliaria_postgres
    restart: always
    environment:
      POSTGRES_DB: imobiliaria_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- 2. PGADMIN (INTERFACE DO BANCO) ---
  pgadmin:
    image: dpage/pgadmin4
    container_name: imobiliaria_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    depends_on:
      - db

  # --- 3. SEU AMBIENTE DE DADOS (JUPYTER LAB) ---
  jupyter-lab:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: imobiliaria_jupyter
    ports:
      - "8888:8888" # Porta para acessar o Jupyter no navegador
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Variáveis para seus notebooks encontrarem o banco
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: imobiliaria_db
      DB_USER: postgres
      DB_PASSWORD: admin
      # Permite root no Jupyter se precisar instalar algo na hora
      GRANT_SUDO: "yes"
    volumes:
      # --- MAPEAMENTO MÁGICO (Windows -> Docker) ---
      # Mapeia a pasta "Data Layer" inteira
      - ./Data Layer:/home/jovyan/work/Data Layer
      # Mapeia a pasta "Transformer" inteira
      - ./Transformer:/home/jovyan/work/Transformer
    # Garante que o Jupyter inicie aceitando conexões externas
    command: start-notebook.sh --NotebookApp.token='' --NotebookApp.password=''

volumes:
  postgres_data:
